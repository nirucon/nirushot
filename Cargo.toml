[package]
name = "nirushot"
version = "0.4.5"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "NIRU screenshot capture and review helper"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
tempfile = "3"
# 0.25.8 keeps the same PNG API while the locked build still compiles with
# Rust 1.85; later 0.25 releases require 1.88.
image = { version = "0.25.8", default-features = false, features = ["png"] }
x11rb = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
