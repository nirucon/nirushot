[package]
name = "nirushot"
version = "0.4.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "NIRU screenshot capture and review helper"

[dependencies]
ab_glyph = "0.2"
chrono = "0.4"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
x11rb = "0.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
